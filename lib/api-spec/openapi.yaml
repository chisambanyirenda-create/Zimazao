openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Zimazao Agricultural Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: listings
    description: Crop listings
  - name: orders
    description: Orders
  - name: disease
    description: Disease detection
  - name: prices
    description: Market prices
  - name: dashboard
    description: Farmer dashboard
  - name: messages
    description: Messages

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get all active crop listings
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new crop listing (farmers only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a single listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /disease/scan:
    post:
      operationId: scanDisease
      tags: [disease]
      summary: Scan crop image for disease using AI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiseaseScanInput"
      responses:
        "200":
          description: Disease scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiseaseScanResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /prices:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Get current crop market prices
      responses:
        "200":
          description: Market prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketPrice"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get farmer dashboard stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterInput:
      type: object
      required: [name, email, password, userType]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
        location:
          type: string
        userType:
          type: string
          enum: [farmer, buyer]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"

    UserPublic:
      type: object
      required: [id, name, email, userType]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        userType:
          type: string
          enum: [farmer, buyer]
        createdAt:
          type: string

    ListingInput:
      type: object
      required: [cropName, price, unit, quantity, location, category]
      properties:
        cropName:
          type: string
          minLength: 1
        price:
          type: number
        unit:
          type: string
        quantity:
          type: string
        location:
          type: string
        category:
          type: string
          enum: [cereals, legumes, tubers, oilseeds, vegetables, fruits, other]
        description:
          type: string
        imageUrl:
          type: ["string", "null"]

    Listing:
      type: object
      required: [id, farmerId, cropName, price, unit, quantity, location, category, isActive, createdAt]
      properties:
        id:
          type: integer
        farmerId:
          type: integer
        farmerName:
          type: ["string", "null"]
        cropName:
          type: string
        price:
          type: string
        unit:
          type: string
        quantity:
          type: string
        location:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [listingId, quantity, totalPrice]
      properties:
        listingId:
          type: integer
        quantity:
          type: string
        totalPrice:
          type: number

    Order:
      type: object
      required: [id, buyerId, listingId, quantity, totalPrice, status, createdAt]
      properties:
        id:
          type: integer
        buyerId:
          type: integer
        listingId:
          type: integer
        quantity:
          type: string
        totalPrice:
          type: string
        status:
          type: string
        createdAt:
          type: string

    DiseaseScanInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data

    DiseaseScanResult:
      type: object
      required: [disease, confidence, description, symptoms, treatment, prevention, severity]
      properties:
        disease:
          type: string
        confidence:
          type: number
        description:
          type: string
        symptoms:
          type: array
          items:
            type: string
        treatment:
          type: array
          items:
            type: string
        prevention:
          type: array
          items:
            type: string
        severity:
          type: string
          enum: [low, medium, high]
        medicines:
          type: array
          items:
            type: string

    MarketPrice:
      type: object
      required: [crop, unit, average, weeklyChange, markets]
      properties:
        crop:
          type: string
        emoji:
          type: string
        unit:
          type: string
        average:
          type: number
        weeklyChange:
          type: number
        markets:
          type: array
          items:
            type: object
            required: [name, price, change]
            properties:
              name:
                type: string
              price:
                type: number
              change:
                type: number

    DashboardStats:
      type: object
      required: [totalSales, activeListings, totalOrders, messages, recentListings]
      properties:
        totalSales:
          type: number
        activeListings:
          type: integer
        totalOrders:
          type: integer
        messages:
          type: integer
        recentListings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
