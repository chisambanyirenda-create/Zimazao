kind = "web"
previewPath = "/"
title = "Zimazao - Agricultural Marketplace"
version = "1.0.0"
id = "artifacts/zimazao"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19683

[services.development]
run = "pnpm --filter @workspace/zimazao run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zimazao", "run", "build" ]
publicDir = "artifacts/zimazao/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19683"
BASE_PATH = "/"
