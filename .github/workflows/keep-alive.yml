name: Keep app awake

# Pings the live app every ~10 minutes so Render's free tier never goes to sleep,
# meaning visitors don't wait for a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 https://zimazao-api.onrender.com/api/healthz || true
